<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>紫微斗數排盤與 AI 智能解析系統</title>
  <style>
    :root {
      --bg-color: #f7f3ee;          /* 溫潤燕麥色背景 */
      --card-bg: #ffffff;           /* 純白象牙卡片背景 */
      --border-color: #d6ccbe;      /* 柔和咖啡灰邊框 */
      --accent-brown: #4a3b32;      /* 沉穩可可棕 */
      --accent-terracotta: #b86b4f; /* 暖橘陶瓦色 */
      --accent-green: #3b7a57;      /* 柔和墨綠 */
      --accent-blue: #3a76a8;       /* 沉穩藍 */
      --accent-purple: #7b52ab;     /* 優雅紫 */
      --text-main: #3a3532;         /* 深可可主字體 */
      --text-muted: #8c8278;        /* 柔和次要字體 */
      --highlight-sanfang: rgba(184, 107, 79, 0.12);
      --highlight-duigong: rgba(58, 118, 168, 0.12);
      --highlight-active: rgba(123, 82, 171, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.7rem;
      color: var(--accent-brown);
      letter-spacing: 2px;
      margin-bottom: 4px;
      font-weight: 700;
    }

    /* 頂部表單控制卡片 */
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      align-items: flex-end;
      box-shadow: 0 2px 8px rgba(74, 59, 50, 0.05);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select, button {
      background: #fcfbfa;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.92rem;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent-brown);
      background: #fff;
    }

    .btn-primary {
      background: var(--accent-brown);
      border-color: var(--accent-brown);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: #eae3d9;
      border-color: var(--border-color);
      color: var(--accent-brown);
      cursor: pointer;
      font-weight: 600;
    }

    .btn-secondary:hover {
      background: #dfd7cc;
    }

    .btn-ai {
      background: linear-gradient(135deg, #7b52ab 0%, #4a3b32 100%);
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-ai:hover {
      opacity: 0.9;
    }

    .btn-ai:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 縮放外框 */
    .chart-viewport-wrapper {
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-bottom: 20px;
      position: relative;
    }

    .chart-scaler {
      transform-origin: top center;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* 4x4 天盤標準基底 740px x 740px */
    .chart-grid {
      width: 740px;
      height: 740px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      background: #eae3d9;
      padding: 8px;
      border: 2px solid var(--accent-brown);
      border-radius: 12px;
      box-sizing: border-box;
      position: relative;
      box-shadow: 0 6px 20px rgba(74, 59, 50, 0.1);
    }

    /* 十二宮位卡片 (字體放大 3pt) */
    .palace-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .palace-card:hover {
      border-color: var(--accent-terracotta);
      transform: translateY(-1px);
    }

    .palace-card.active-selected {
      border-color: var(--accent-purple) !important;
      background: var(--highlight-active) !important;
      box-shadow: 0 0 12px rgba(123, 82, 171, 0.25);
    }

    .palace-card.highlight-opposite {
      background: var(--highlight-duigong);
      border-color: var(--accent-blue);
    }

    .palace-card.highlight-trine {
      background: var(--highlight-sanfang);
      border-color: var(--accent-terracotta);
    }

    .stars-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 54px;
      align-content: flex-start;
    }

    /* 放大約 3pt 的星曜與文字 */
    .star-badge {
      font-size: 1.02rem; /* 原 0.8rem 放大約 3pt */
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .star-major {
      color: #8c5a23;
      background: rgba(140, 90, 35, 0.1);
    }

    .star-minor-good {
      color: var(--accent-green);
      background: rgba(59, 122, 87, 0.1);
      font-size: 0.95rem; /* 放大 3pt */
    }

    .star-minor-bad {
      color: #b83b3b;
      background: rgba(184, 59, 59, 0.1);
      font-size: 0.95rem; /* 放大 3pt */
    }

    .star-brightness {
      font-size: 0.8rem; /* 放大 3pt */
      opacity: 0.85;
      font-weight: 500;
    }

    .sihua-tag {
      font-size: 0.8rem; /* 放大 3pt */
      padding: 0 4px;
      border-radius: 3px;
      margin-left: 2px;
      font-weight: 800;
    }
    .sihua-lu { background: #3b7a57; color: #fff; }
    .sihua-quan { background: #b83b3b; color: #fff; }
    .sihua-ke { background: #3a76a8; color: #fff; }
    .sihua-ji { background: #7b52ab; color: #fff; }

    .palace-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 4px;
      border-top: 1px dashed var(--border-color);
      padding-top: 5px;
    }

    .limits-info {
      font-size: 0.85rem; /* 放大 3pt (原 0.68rem) */
      color: var(--text-muted);
      line-height: 1.3;
      font-weight: 500;
    }

    .palace-name-group {
      text-align: right;
    }

    .palace-name {
      font-size: 1.12rem; /* 放大 3pt (原 0.92rem) */
      font-weight: bold;
      color: var(--accent-brown);
    }

    .palace-body-mark {
      font-size: 0.85rem; /* 放大 3pt */
      color: #b83b3b;
      margin-left: 2px;
    }

    .palace-stem-branch {
      font-size: 0.95rem; /* 放大 3pt (原 0.76rem) */
      color: var(--accent-terracotta);
      font-weight: 600;
    }

    /* 中央中堂 2x2 空間 */
    .center-hall {
      grid-column: 2 / 4;
      grid-row: 2 / 4;
      background: var(--card-bg);
      border: 2px solid var(--accent-brown);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 12px rgba(74, 59, 50, 0.08);
    }

    .bazi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      background: #f7f3ee;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 6px;
      border: 1px solid var(--border-color);
    }

    .bazi-item .pillar-title {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .bazi-item .pillar-val {
      font-size: 1.08rem;
      font-weight: bold;
      color: var(--accent-brown);
    }

    .meta-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 6px;
    }

    .meta-chip {
      background: #f7f3ee;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 0.82rem;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .sanfang-inspector {
      background: #f7f3ee;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      font-size: 0.84rem;
      color: var(--text-muted);
      min-height: 54px;
    }

    .sanfang-inspector span {
      color: var(--accent-brown);
      font-weight: 600;
    }

    /* AI 解析面板 */
    .ai-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 16px rgba(74, 59, 50, 0.06);
    }

    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ai-header h2 {
      font-size: 1.2rem;
      color: var(--accent-brown);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .ai-config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
      background: #f7f3ee;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .ai-output-box {
      background: #fcfbfa;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      min-height: 160px;
      font-size: 0.96rem;
      color: var(--text-main);
      position: relative;
    }

    .ai-output-box.loading {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Markdown 樣式 */
    /* .ai-markdown h3 {
      color: var(--accent-brown);
      margin: 14px 0 6px 0;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 3px;
    }
    .ai-markdown h3:first-child { margin-top: 0; }
    .ai-markdown p { margin-bottom: 8px; }
    .ai-markdown strong { color: var(--accent-terracotta); font-weight: 600; }
    .ai-markdown ul { margin-left: 18px; margin-bottom: 10px; }
    .ai-markdown li { margin-bottom: 3px; }
    .ai-markdown blockquote {
      border-left: 3px solid var(--accent-blue);
      padding-left: 10px;
      color: var(--text-muted);
      margin: 10px 0;
    } */
    /* Markdown 排版與階層優化 */
    .ai-markdown h3 {
      color: var(--accent-brown);
      margin: 20px 0 10px 0;
      font-size: 1.18rem;
      border-bottom: 1.5px solid var(--border-color);
      padding-bottom: 5px;
      font-weight: 700;
    }
    .ai-markdown h3:first-child { margin-top: 0; }
    
    /* 支援四級子標題 #### */
    .ai-markdown h4 {
      color: var(--accent-terracotta);
      font-size: 1.05rem;
      margin: 16px 0 8px 0;
      font-weight: 600;
    }

    .ai-markdown p { 
      margin-bottom: 10px; 
      line-height: 1.75; 
    }
    .ai-markdown strong { 
      color: var(--accent-terracotta); 
      font-weight: 600; 
    }
    
    /* 分隔線美化 */
    .ai-markdown hr.ai-divider {
      border: none;
      border-top: 1px dashed var(--border-color);
      margin: 18px 0;
    }

    /* 條列式清單與子項目對齊 */
    .ai-markdown ul, .ai-markdown ol { 
      margin: 8px 0 14px 22px; 
      padding: 0;
    }
    .ai-markdown li { 
      margin-bottom: 6px; 
      line-height: 1.7;
    }
    .ai-markdown li.ai-sub-item {
      margin-left: 18px;
      list-style-type: circle;
    }
    
    .ai-markdown blockquote {
      border-left: 4px solid var(--accent-blue);
      background: rgba(58, 118, 168, 0.06);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      color: var(--text-main);
      margin: 14px 0;
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .cursor-blink {
      display: inline-block;
      width: 5px;
      height: 14px;
      background: var(--accent-brown);
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>紫微斗數命盤解析</h1>
    <p style="color: var(--text-muted); font-size: 0.88rem;">質感美學排盤 ‧ 納音五行局 ‧ AI 智能深度解盤</p>
  </header>

  <!-- 參數配置列 -->
  <div class="control-panel">
    <div class="form-group">
      <label>曆法輸入模式</label>
      <select id="calendarMode" onchange="toggleCalendarMode()">
        <option value="solar">西曆/國曆 (自動換算)</option>
        <option value="lunar">直接指定農曆</option>
      </select>
    </div>

    <div class="form-group" id="solarDateGroup">
      <label>西曆出生年月日</label>
      <input type="date" id="solarDate" />
    </div>

    <div class="form-group" id="lunarYearGroup" style="display:none;">
      <label>農曆年 (西元)</label>
      <input type="number" id="lunarYear" min="1900" max="2050" />
    </div>

    <div class="form-group" id="lunarMonthGroup" style="display:none;">
      <label>農曆月</label>
      <select id="lunarMonth">
        <option value="1">正月 (1月)</option>
        <option value="2">二月 (2月)</option>
        <option value="3">三月 (3月)</option>
        <option value="4">四月 (4月)</option>
        <option value="5">五月 (5月)</option>
        <option value="6">六月 (6月)</option>
        <option value="7">七月 (7月)</option>
        <option value="8">八月 (8月)</option>
        <option value="9">九月 (9月)</option>
        <option value="10">十月 (10月)</option>
        <option value="11">十一月 (11月)</option>
        <option value="12">十二月 (12月)</option>
      </select>
    </div>

    <div class="form-group" id="lunarDayGroup" style="display:none;">
      <label>農曆出生日</label>
      <input type="number" id="lunarDay" min="1" max="30" />
    </div>

    <div class="form-group">
      <label>出生時辰 (地支)</label>
      <select id="hourBranch">
        <option value="0" selected>子時 (23:00 - 01:00)</option>
        <option value="1">丑時 (01:00 - 03:00)</option>
        <option value="2">寅時 (03:00 - 05:00)</option>
        <option value="3">卯時 (05:00 - 07:00)</option>
        <option value="4">辰時 (07:00 - 09:00)</option>
        <option value="5">巳時 (09:00 - 11:00)</option>
        <option value="6">午時 (11:00 - 13:00)</option>
        <option value="7">未時 (13:00 - 15:00)</option>
        <option value="8">申時 (15:00 - 17:00)</option>
        <option value="9">酉時 (17:00 - 19:00)</option>
        <option value="10">戌時 (19:00 - 21:00)</option>
        <option value="11">亥時 (21:00 - 23:00)</option>
      </select>
    </div>

    <div class="form-group">
      <label>性別</label>
      <select id="gender">
        <option value="M">男 (乾造)</option>
        <option value="F">女 (坤造)</option>
      </select>
    </div>

    <div class="form-group">
      <label>庚干四化設定</label>
      <select id="gengMode">
        <option value="tong_ji">陽武府同 (天同忌)</option>
        <option value="yin_ji">陽武同陰 (太陰忌)</option>
      </select>
    </div>

    <button class="btn-primary" onclick="generateChart()">排列命盤</button>
    <button class="btn-secondary" onclick="exportJSON()">匯出 JSON</button>
  </div>

  <!-- 天盤自適應縮放外框 -->
  <div class="chart-viewport-wrapper" id="chartViewport">
    <div class="chart-scaler" id="chartScaler">
      <div class="chart-grid" id="chartGrid">
        <!-- 中央中堂 -->
        <div class="center-hall" id="centerHall">
          <div>
            <div class="bazi-row">
              <div class="bazi-item"><div class="pillar-title">年柱</div><div class="pillar-val" id="yearPillar">-</div></div>
              <div class="bazi-item"><div class="pillar-title">月柱</div><div class="pillar-val" id="monthPillar">-</div></div>
              <div class="bazi-item"><div class="pillar-title">日柱</div><div class="pillar-val" id="dayPillar">-</div></div>
              <div class="bazi-item"><div class="pillar-title">時柱</div><div class="pillar-val" id="hourPillar">-</div></div>
            </div>
            <div class="meta-tags">
              <div class="meta-chip">造化：<span id="genderMeta" style="color:var(--accent-brown); font-weight:600;">-</span></div>
              <div class="meta-chip">局數：<span id="bureauMeta" style="color:var(--accent-brown); font-weight:600;">-</span></div>
              <div class="meta-chip">命主：<span id="lifeLordMeta" style="color:var(--accent-brown); font-weight:600;">-</span></div>
              <div class="meta-chip">身主：<span id="bodyLordMeta" style="color:var(--accent-brown); font-weight:600;">-</span></div>
            </div>
          </div>

          <div class="sanfang-inspector" id="sanfangInspector">
            點選任一宮位，即可在此檢視其「三方四正」（本宮、對宮、三合方）交會星曜。
          </div>

          <div class="actions-bar" style="margin-top:4px;">
            <span style="font-size:0.78rem; color:var(--text-muted);">提示：點擊任一宮位可聯動高亮三方四正。</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- AI 命盤智能命理解析面板 -->
  <div class="ai-section">
    <div class="ai-header">
      <h2><span>✦</span> AI 智能命理解析</h2>
      <div style="display:flex; gap:8px;">
        <button class="btn-ai" id="btnRunAI" onclick="triggerAIAnalysis()">✨ 生成命理報告</button>
        <button class="btn-secondary" onclick="copyAnalysisText()">複製報告</button>
      </div>
    </div>

    <!-- AI 配置與主題選單 -->
    <div class="ai-config-grid">
      <div class="form-group">
        <label>推演模型</label>
        <select id="aiModelSelect" onchange="toggleApiKeyVisibility()">
          <option value="builtin_local">本機紫微推理引擎 (免金鑰即用)</option>
          <option value="gemini">Google Gemini API (線上大模型)</option>
          <option value="openai_compatible">OpenAI 相容 API / Ollama 端點</option>
        </select>
      </div>

      <div class="form-group">
        <label>論命主題焦點</label>
        <select id="aiFocusTopic">
          <option value="overview">全盤格局與性格特質總論</option>
          <option value="career">官祿事業與職場競爭力</option>
          <option value="wealth">財帛進財管道與資產佈局</option>
          <option value="marriage">夫妻感情與伴侶宮位解讀</option>
          <option value="decadal">大限行運與生年四化引動分析</option>
        </select>
      </div>

      <div class="form-group" id="apiKeyGroup" style="display:none;">
        <label>API Key (僅暫存於本地)</label>
        <input type="password" id="userApiKey" placeholder="輸入 API 金鑰..." />
      </div>

      <div class="form-group" id="apiEndpointGroup" style="display:none;">
        <label>API Endpoint (選填)</label>
        <input type="text" id="userApiEndpoint" value="https://api.openai.com/v1" />
      </div>
    </div>

    <!-- AI 解析文字渲染區塊 -->
    <div class="ai-output-box" id="aiOutputBox">
      點擊上方「✨ 生成命理報告」按鈕，系統將自動提取當前命盤之命身宮、三方四正星曜、生年四化與五行局，為你提供客製化深度推理報告。
    </div>
  </div>
</div>

<script>
const STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
const BRANCHES = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
const PALACE_NAMES = ["命宮", "兄弟", "夫妻", "子女", "財帛", "疾厄", "遷移", "僕役", "官祿", "田宅", "福德", "父母"];

const BRIGHTNESS_MAP = {
  "紫微": ["平", "廟", "廟", "旺", "得", "旺", "廟", "廟", "得", "旺", "得", "平"],
  "天機": ["廟", "陷", "得", "旺", "利", "平", "廟", "陷", "得", "旺", "利", "平"],
  "太陽": ["陷", "不", "旺", "廟", "廟", "旺", "廟", "得", "得", "平", "不", "陷"],
  "武曲": ["旺", "廟", "得", "利", "廟", "平", "旺", "廟", "得", "旺", "廟", "平"],
  "天同": ["旺", "不", "利", "平", "平", "廟", "陷", "不", "旺", "平", "平", "廟"],
  "廉貞": ["平", "利", "廟", "平", "利", "陷", "平", "廟", "廟", "平", "利", "陷"],
  "天府": ["廟", "廟", "廟", "得", "廟", "得", "旺", "廟", "得", "旺", "廟", "得"],
  "太陰": ["廟", "廟", "陷", "陷", "陷", "陷", "不", "不", "平", "旺", "旺", "廟"],
  "貪狼": ["旺", "廟", "平", "平", "廟", "陷", "旺", "廟", "平", "平", "廟", "陷"],
  "巨門": ["旺", "不", "廟", "廟", "陷", "平", "旺", "不", "廟", "廟", "陷", "旺"],
  "天相": ["廟", "廟", "廟", "陷", "得", "得", "旺", "得", "廟", "陷", "得", "得"],
  "天梁": ["廟", "旺", "廟", "廟", "廟", "陷", "廟", "旺", "陷", "得", "廟", "陷"],
  "七殺": ["旺", "廟", "廟", "平", "廟", "平", "旺", "廟", "廟", "平", "廟", "平"],
  "破軍": ["廟", "旺", "得", "陷", "旺", "平", "廟", "旺", "得", "陷", "旺", "平"]
};

const NAYIN_BUREAU = {
  "甲子":4,"乙丑":4,"丙寅":6,"丁卯":6,"戊辰":3,"己巳":3,"庚午":5,"辛未":5,"壬申":4,"癸酉":4,
  "甲戌":6,"乙亥":6,"丙子":2,"丁丑":2,"戊寅":5,"己卯":5,"庚辰":4,"辛巳":4,"壬午":3,"癸未":3,
  "甲申":2,"乙酉":2,"丙戌":5,"丁亥":5,"戊子":6,"己丑":6,"庚寅":3,"辛卯":3,"壬辰":2,"癸巳":2,
  "甲午":4,"乙未":4,"丙申":6,"丁酉":6,"戊戌":3,"己亥":3,"庚子":5,"辛丑":5,"壬寅":4,"癸卯":4,
  "甲辰":6,"乙巳":6,"丙午":2,"丁未":2,"戊申":5,"己酉":5,"庚戌":4,"辛亥":4,"壬子":3,"癸丑":3,
  "甲寅":2,"乙卯":2,"丙辰":5,"丁巳":5,"戊午":6,"己未":6,"庚申":3,"辛酉":3,"壬戌":2,"癸亥":2
};

const BUREAU_NAMES = { 2: "水二局", 3: "木三局", 4: "金四局", 5: "土五局", 6: "火六局" };

const GRID_POSITIONS = {
  5:  { col: 1, row: 1 }, 6:  { col: 2, row: 1 }, 7:  { col: 3, row: 1 }, 8:  { col: 4, row: 1 },
  9:  { col: 4, row: 2 }, 10: { col: 4, row: 3 }, 11: { col: 4, row: 4 }, 0:  { col: 3, row: 4 },
  1:  { col: 2, row: 4 }, 2:  { col: 1, row: 4 }, 3:  { col: 1, row: 3 }, 4:  { col: 1, row: 2 }
};

let currentChartData = null;

function autoScaleChart() {
  const wrapper = document.getElementById("chartViewport");
  const scaler = document.getElementById("chartScaler");
  const grid = document.getElementById("chartGrid");
  if (!wrapper || !scaler || !grid) return;

  const availableWidth = wrapper.clientWidth;
  const baseWidth = 740;
  const baseHeight = 740;

  const scale = Math.min(1, availableWidth / baseWidth);
  scaler.style.transform = `scale(${scale})`;
  wrapper.style.height = `${baseHeight * scale}px`;
}

window.addEventListener("resize", autoScaleChart);
window.addEventListener("orientationchange", () => setTimeout(autoScaleChart, 150));

function toggleCalendarMode() {
  const mode = document.getElementById("calendarMode").value;
  document.getElementById("solarDateGroup").style.display = mode === "solar" ? "flex" : "none";
  document.getElementById("lunarYearGroup").style.display = mode === "lunar" ? "flex" : "none";
  document.getElementById("lunarMonthGroup").style.display = mode === "lunar" ? "flex" : "none";
  document.getElementById("lunarDayGroup").style.display = mode === "lunar" ? "flex" : "none";
}

function toggleApiKeyVisibility() {
  const model = document.getElementById("aiModelSelect").value;
  const isCloud = model !== "builtin_local";
  document.getElementById("apiKeyGroup").style.display = isCloud ? "flex" : "none";
  document.getElementById("apiEndpointGroup").style.display = model === "openai_compatible" ? "flex" : "none";
}

function solarToLunar(sDate) {
  try {
    const dtf = new Intl.DateTimeFormat('zh-TW-u-ca-chinese', { year: 'numeric', month: 'numeric', day: 'numeric' });
    const parts = dtf.formatToParts(sDate);
    let y, m, d;
    for (const part of parts) {
      if (part.type === 'relatedYear') y = parseInt(part.value, 10);
      else if (part.type === 'year' && !y) {
        const parsed = parseInt(part.value, 10);
        if (!isNaN(parsed)) y = parsed;
      } else if (part.type === 'month') {
        let val = part.value;
        let num = parseInt(val.replace(/[^0-9]/g, ''), 10);
        if (isNaN(num)) {
          const cnNums = {'正':1,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'冬':11,'十一':11,'臘':12,'十二':12};
          for (let key in cnNums) { if (val.includes(key)) { num = cnNums[key]; break; } }
        }
        m = num || 1;
      } else if (part.type === 'day') {
        let val = part.value;
        let num = parseInt(val.replace(/[^0-9]/g, ''), 10);
        if (isNaN(num)) {
          const dayMap = {'初一':1,'初二':2,'初三':3,'初四':4,'初五':5,'初六':6,'初七':7,'初八':8,'初九':9,'初十':10,'十一':11,'十二':12,'十三':13,'十四':14,'十五':15,'十六':16,'十七':17,'十八':18,'十九':19,'二十':20,'廿一':21,'廿二':22,'廿三':23,'廿四':24,'廿五':25,'廿六':26,'廿七':27,'廿八':28,'廿九':29,'三十':30};
          for (let key in dayMap) { if (val.includes(key)) { num = dayMap[key]; break; } }
        }
        d = num || 1;
      }
    }
    if (y && m && d) return { year: y, month: m, day: d, isLeap: false };
  } catch (e) {}
  const y = sDate.getFullYear();
  const m = sDate.getMonth() + 1;
  const d = sDate.getDate();
  return { year: y, month: Math.max(1, m - 1), day: Math.min(30, d), isLeap: false };
}

function calculateZiWeiChart(params) {
  const { yearStemIdx, yearBranchIdx, month, day, hourBranchIdx, gender, gengMode } = params;
  const posMing = ((2 + (month - 1) - hourBranchIdx) % 12 + 12) % 12;
  const posShen = (2 + (month - 1) + hourBranchIdx) % 12;
  const stemYin = ((yearStemIdx % 5) * 2 + 2) % 10;
  const palaceStems = [];
  for (let b = 0; b < 12; b++) {
    const step = (b - 2 + 12) % 12;
    palaceStems[b] = (stemYin + step) % 10;
  }
  const mingStemIdx = palaceStems[posMing];
  const mingKey = STEMS[mingStemIdx] + BRANCHES[posMing];
  const bureauNum = NAYIN_BUREAU[mingKey] || 2;
  const bureauName = BUREAU_NAMES[bureauNum];

  let remainder = day % bureauNum;
  let x = remainder === 0 ? 0 : bureauNum - remainder;
  let q = (day + x) / bureauNum;
  let baseZiWei = 2 + (q - 1);
  let posZiWei = (x % 2 === 0) ? (baseZiWei + x) : (baseZiWei - x);
  posZiWei = ((posZiWei % 12) + 12) % 12;
  const posTianFu = ((4 - posZiWei) % 12 + 12) % 12;

  const palaces = Array.from({ length: 12 }, (_, b) => {
    const palaceOffset = (posMing - b + 12) % 12;
    return {
      branchIndex: b,
      branch: BRANCHES[b],
      stem: STEMS[palaceStems[b]],
      name: PALACE_NAMES[palaceOffset],
      isBody: b === posShen,
      majorStars: [],
      minorStars: [],
      shaStars: [],
      decadalRange: "",
      yearlyAges: []
    };
  });

  const ziweiGroup = [
    { name: "紫微", offset: 0 }, { name: "天機", offset: -1 },
    { name: "太陽", offset: -3 }, { name: "武曲", offset: -4 },
    { name: "天同", offset: -5 }, { name: "廉貞", offset: -8 }
  ];
  ziweiGroup.forEach(star => {
    const p = ((posZiWei + star.offset) % 12 + 12) % 12;
    palaces[p].majorStars.push(star.name);
  });

  const tianfuGroup = [
    { name: "天府", offset: 0 }, { name: "太陰", offset: 1 },
    { name: "貪狼", offset: 2 }, { name: "巨門", offset: 3 },
    { name: "天相", offset: 4 }, { name: "天梁", offset: 5 },
    { name: "七殺", offset: 6 }, { name: "破軍", offset: 10 }
  ];
  tianfuGroup.forEach(star => {
    const p = (posTianFu + star.offset) % 12;
    palaces[p].majorStars.push(star.name);
  });

  const posZuoFu = (4 + (month - 1)) % 12;
  const posYouBi = ((10 - (month - 1)) % 12 + 12) % 12;
  palaces[posZuoFu].minorStars.push("左輔");
  palaces[posYouBi].minorStars.push("右弼");

  const posWenChang = ((10 - hourBranchIdx) % 12 + 12) % 12;
  const posWenQu = (4 + hourBranchIdx) % 12;
  palaces[posWenChang].minorStars.push("文昌");
  palaces[posWenQu].minorStars.push("文曲");

  const kuiMap = [1, 0, 11, 11, 1, 0, 1, 6, 3, 3];
  const yueMap = [7, 8, 9, 9, 7, 8, 7, 2, 5, 5];
  palaces[kuiMap[yearStemIdx]].minorStars.push("天魁");
  palaces[yueMap[yearStemIdx]].minorStars.push("天鉞");

  const luCunMap = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0];
  const posLuCun = luCunMap[yearStemIdx];
  palaces[posLuCun].minorStars.push("祿存");
  palaces[(posLuCun + 1) % 12].shaStars.push("擎羊");
  palaces[((posLuCun - 1) % 12 + 12) % 12].shaStars.push("陀羅");

  const posDiKong = ((11 - hourBranchIdx) % 12 + 12) % 12;
  const posDiJie = (11 + hourBranchIdx) % 12;
  palaces[posDiKong].shaStars.push("地空");
  palaces[posDiJie].shaStars.push("地劫");

  let huoBase = 1, lingBase = 3;
  if ([8, 0, 4].includes(yearBranchIdx)) { huoBase = 2; lingBase = 10; }
  else if ([5, 9, 1].includes(yearBranchIdx)) { huoBase = 3; lingBase = 10; }
  else if ([11, 3, 7].includes(yearBranchIdx)) { huoBase = 9; lingBase = 10; }
  palaces[(huoBase + hourBranchIdx) % 12].shaStars.push("火星");
  palaces[(lingBase + hourBranchIdx) % 12].shaStars.push("鈴星");

  let posTianMa = 8;
  if ([8, 0, 4].includes(yearBranchIdx)) posTianMa = 2;
  else if ([5, 9, 1].includes(yearBranchIdx)) posTianMa = 11;
  else if ([11, 3, 7].includes(yearBranchIdx)) posTianMa = 5;
  palaces[posTianMa].minorStars.push("天馬");

  const posHongLuan = ((3 - yearBranchIdx) % 12 + 12) % 12;
  const posTianXi = (posHongLuan + 6) % 12;
  palaces[posHongLuan].minorStars.push("紅鸞");
  palaces[posTianXi].minorStars.push("天喜");

  const sihuaTables = [
    { "廉貞": "祿", "破軍": "權", "武曲": "科", "太陽": "忌" },
    { "天機": "祿", "天梁": "權", "紫微": "科", "太陰": "忌" },
    { "天同": "祿", "天機": "權", "文昌": "科", "廉貞": "忌" },
    { "太陰": "祿", "天同": "權", "天機": "科", "巨門": "忌" },
    { "貪狼": "祿", "太陰": "權", "右弼": "科", "天機": "忌" },
    { "武曲": "祿", "貪狼": "權", "天梁": "科", "文曲": "忌" },
    gengMode === "tong_ji" 
      ? { "太陽": "祿", "武曲": "權", "天府": "科", "天同": "忌" } 
      : { "太陽": "祿", "武曲": "權", "太陰": "科", "天同": "忌" },
    { "巨門": "祿", "太陽": "權", "文曲": "科", "文昌": "忌" },
    { "天梁": "祿", "紫微": "權", "左輔": "科", "武曲": "忌" },
    { "破軍": "祿", "巨門": "權", "太陰": "科", "貪狼": "忌" }
  ];
  const sihua = sihuaTables[yearStemIdx];

  const isYangYear = yearStemIdx % 2 === 0;
  const isClockwiseLimit = (gender === "M" && isYangYear) || (gender === "F" && !isYangYear);

  for (let k = 0; k < 12; k++) {
    const targetBranch = isClockwiseLimit ? (posMing + k) % 12 : ((posMing - k) % 12 + 12) % 12;
    const startAge = bureauNum + k * 10;
    palaces[targetBranch].decadalRange = `${startAge}-${startAge + 9}`;
  }

  let xiaoXianStart = 4;
  if ([8, 0, 4].includes(yearBranchIdx)) xiaoXianStart = 10;
  else if ([5, 9, 1].includes(yearBranchIdx)) xiaoXianStart = 7;
  else if ([11, 3, 7].includes(yearBranchIdx)) xiaoXianStart = 1;

  const isXiaoXianClockwise = (gender === "M");
  for (let age = 1; age <= 84; age++) {
    const offset = (age - 1) % 12;
    const branch = isXiaoXianClockwise ? (xiaoXianStart + offset) % 12 : ((xiaoXianStart - offset) % 12 + 12) % 12;
    if (age <= 36 || age % 12 === 1) palaces[branch].yearlyAges.push(age);
  }

  const lifeLords = ["貪狼", "巨門", "祿存", "文曲", "廉貞", "武曲", "破軍", "武曲", "廉貞", "文曲", "祿存", "巨門"];
  const bodyLords = ["火星", "天相", "天梁", "天同", "文昌", "天機", "火星", "天相", "天梁", "天同", "文昌", "天機"];

  return {
    meta: {
      gender: gender === "M" ? (isYangYear ? "陽男" : "陰男") : (isYangYear ? "陽女" : "陰女"),
      bureau: bureauName,
      lifeLord: lifeLords[posMing],
      bodyLord: bodyLords[yearBranchIdx],
      sihua: sihua,
      yearStem: STEMS[yearStemIdx],
      yearBranch: BRANCHES[yearBranchIdx],
      month: month,
      day: day,
      hourBranch: BRANCHES[hourBranchIdx]
    },
    palaces: palaces,
    posMing: posMing,
    posShen: posShen
  };
}

function renderChart(chart) {
  currentChartData = chart;
  const grid = document.getElementById("chartGrid");
  const oldCards = grid.querySelectorAll(".palace-card");
  oldCards.forEach(c => c.remove());

  document.getElementById("yearPillar").textContent = `${chart.meta.yearStem}${chart.meta.yearBranch}`;
  document.getElementById("monthPillar").textContent = `農曆 ${chart.meta.month} 月`;
  document.getElementById("dayPillar").textContent = `初 ${chart.meta.day} 日`;
  document.getElementById("hourPillar").textContent = `${chart.meta.hourBranch} 時`;

  document.getElementById("genderMeta").textContent = chart.meta.gender;
  document.getElementById("bureauMeta").textContent = chart.meta.bureau;
  document.getElementById("lifeLordMeta").textContent = chart.meta.lifeLord;
  document.getElementById("bodyLordMeta").textContent = chart.meta.bodyLord;

  chart.palaces.forEach(p => {
    const pos = GRID_POSITIONS[p.branchIndex];
    const card = document.createElement("div");
    card.className = "palace-card";
    card.style.gridColumn = pos.col;
    card.style.gridRow = pos.row;
    card.id = `palace-${p.branchIndex}`;
    card.onclick = () => inspectPalace(p.branchIndex);

    const starsDiv = document.createElement("div");
    starsDiv.className = "stars-container";

    p.majorStars.forEach(starName => {
      const bLevel = BRIGHTNESS_MAP[starName] ? BRIGHTNESS_MAP[starName][p.branchIndex] : "";
      const sh = chart.meta.sihua[starName];
      let sihuaHtml = "";
      if (sh === "祿") sihuaHtml = `<span class="sihua-tag sihua-lu">祿</span>`;
      if (sh === "權") sihuaHtml = `<span class="sihua-tag sihua-quan">權</span>`;
      if (sh === "科") sihuaHtml = `<span class="sihua-tag sihua-ke">科</span>`;
      if (sh === "忌") sihuaHtml = `<span class="sihua-tag sihua-ji">忌</span>`;

      starsDiv.innerHTML += `
        <span class="star-badge star-major">
          ${starName}<span class="star-brightness">${bLevel}</span>${sihuaHtml}
        </span>
      `;
    });

    p.minorStars.forEach(starName => {
      const sh = chart.meta.sihua[starName];
      let sihuaHtml = "";
      if (sh === "科") sihuaHtml = `<span class="sihua-tag sihua-ke">科</span>`;
      starsDiv.innerHTML += `<span class="star-badge star-minor-good">${starName}${sihuaHtml}</span>`;
    });

    p.shaStars.forEach(starName => {
      starsDiv.innerHTML += `<span class="star-badge star-minor-bad">${starName}</span>`;
    });

    const footerDiv = document.createElement("div");
    footerDiv.className = "palace-footer";

    const limitsDiv = document.createElement("div");
    limitsDiv.className = "limits-info";
    limitsDiv.innerHTML = `
      <div>限 ${p.decadalRange}</div>
      <div style="font-size:0.78rem; opacity:0.85;">小 ${p.yearlyAges.slice(0, 2).join(",") || "-"}</div>
    `;

    const nameGroup = document.createElement("div");
    nameGroup.className = "palace-name-group";
    nameGroup.innerHTML = `
      <div class="palace-name">
        ${p.name}${p.isBody ? '<span class="palace-body-mark">(身)</span>' : ''}
      </div>
      <div class="palace-stem-branch">${p.stem}${p.branch}</div>
    `;

    footerDiv.appendChild(limitsDiv);
    footerDiv.appendChild(nameGroup);
    card.appendChild(starsDiv);
    card.appendChild(footerDiv);
    grid.appendChild(card);
  });

  inspectPalace(chart.posMing);
  autoScaleChart();
}

function inspectPalace(targetBranchIdx) {
  if (!currentChartData) return;
  document.querySelectorAll(".palace-card").forEach(c => {
    c.classList.remove("active-selected", "highlight-opposite", "highlight-trine");
  });

  const oppositeIdx = (targetBranchIdx + 6) % 12;
  const trine1Idx = (targetBranchIdx + 4) % 12;
  const trine2Idx = (targetBranchIdx + 8) % 12;

  document.getElementById(`palace-${targetBranchIdx}`).classList.add("active-selected");
  document.getElementById(`palace-${oppositeIdx}`).classList.add("highlight-opposite");
  document.getElementById(`palace-${trine1Idx}`).classList.add("highlight-trine");
  document.getElementById(`palace-${trine2Idx}`).classList.add("highlight-trine");

  const pCurrent = currentChartData.palaces[targetBranchIdx];
  const pOpposite = currentChartData.palaces[oppositeIdx];
  const pTrine1 = currentChartData.palaces[trine1Idx];
  const pTrine2 = currentChartData.palaces[trine2Idx];

  function formatStars(p) {
    const list = [...p.majorStars, ...p.minorStars, ...p.shaStars];
    return list.length > 0 ? list.join("、") : "無主要曜星";
  }

  const inspector = document.getElementById("sanfangInspector");
  inspector.innerHTML = `
    <div style="font-weight:bold; color:var(--accent-brown); margin-bottom:2px;">
      【${pCurrent.name} (${pCurrent.stem}${pCurrent.branch}) 三方四正】
    </div>
    <div><span>本宮：</span>${formatStars(pCurrent)}</div>
    <div><span style="color:var(--accent-blue);">對宮 (${pOpposite.name})：</span>${formatStars(pOpposite)}</div>
    <div><span style="color:var(--accent-terracotta);">三合一 (${pTrine1.name})：</span>${formatStars(pTrine1)}</div>
    <div><span style="color:var(--accent-terracotta);">三合二 (${pTrine2.name})：</span>${formatStars(pTrine2)}</div>
  `;
}

function generateChart() {
  const mode = document.getElementById("calendarMode").value;
  const hourBranchIdx = parseInt(document.getElementById("hourBranch").value, 10);
  const gender = document.getElementById("gender").value;
  const gengMode = document.getElementById("gengMode").value;

  let yearStemIdx, yearBranchIdx, month, day;

  if (mode === "solar") {
    const sDateVal = document.getElementById("solarDate").value;
    if (!sDateVal) return;
    const sDate = new Date(sDateVal);
    const lunar = solarToLunar(sDate);
    month = lunar.month;
    day = lunar.day;
    const offset = lunar.year - 1984;
    yearStemIdx = ((offset % 10) + 10) % 10;
    yearBranchIdx = ((offset % 12) + 12) % 12;
  } else {
    const lYear = parseInt(document.getElementById("lunarYear").value, 10);
    month = parseInt(document.getElementById("lunarMonth").value, 10);
    day = parseInt(document.getElementById("lunarDay").value, 10);
    const offset = lYear - 1984;
    yearStemIdx = ((offset % 10) + 10) % 10;
    yearBranchIdx = ((offset % 12) + 12) % 12;
  }

  const chart = calculateZiWeiChart({ yearStemIdx, yearBranchIdx, month, day, hourBranchIdx, gender, gengMode });
  renderChart(chart);
}

function exportJSON() {
  if (!currentChartData) return;
  const blob = new Blob([JSON.stringify(currentChartData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ziwei_chart_${currentChartData.meta.yearStem}${currentChartData.meta.yearBranch}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function parseMarkdown(md) {
  if (!md) return "";

  // 1. 處理行內粗體與斜體
  let text = md
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>');

  const lines = text.split('\n');
  let html = [];
  let inList = false;
  let listType = null; // 'ul' 或 'ol'

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trimEnd();
    const trimmed = line.trim();

    // 處理空行
    if (!trimmed) {
      if (inList) {
        html.push(listType === 'ul' ? '</ul>' : '</ol>');
        inList = false;
        listType = null;
      }
      continue;
    }

    // 分隔線 ---
    if (/^(\-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
      if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html.push('<hr class="ai-divider" />');
      continue;
    }

    // 支援 #### 四級標題
    if (/^####\s+(.*)/.test(trimmed)) {
      if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html.push(`<h4>${trimmed.replace(/^####\s+/, '')}</h4>`);
      continue;
    }

    // 支援 ### 三級標題
    if (/^###\s+(.*)/.test(trimmed)) {
      if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html.push(`<h3>${trimmed.replace(/^###\s+/, '')}</h3>`);
      continue;
    }

    // 支援 # 或 ## 大標題
    if (/^##?\s+(.*)/.test(trimmed)) {
      if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html.push(`<h3>${trimmed.replace(/^##?\s+/, '')}</h3>`);
      continue;
    }

    // 引用區塊
    if (/^>\s?(.*)/.test(trimmed)) {
      if (inList) { html.push(listType === 'ul' ? '</ul>' : '</ol>'); inList = false; }
      html.push(`<blockquote>${trimmed.replace(/^>\s?/, '')}</blockquote>`);
      continue;
    }

    // 無序清單（支援多層級縮排，如 "  -"）
    const ulMatch = line.match(/^(\s*)[-*•]\s+(.*)/);
    if (ulMatch) {
      const indent = ulMatch[1].length;
      const content = ulMatch[2];
      if (!inList || listType !== 'ul') {
        if (inList) html.push(listType === 'ul' ? '</ul>' : '</ol>');
        html.push('<ul>');
        inList = true;
        listType = 'ul';
      }
      const subClass = indent >= 2 ? ' class="ai-sub-item"' : '';
      html.push(`<li${subClass}>${content}</li>`);
      continue;
    }

    // 有序清單（如 1. 2.）
    const olMatch = line.match(/^(\s*)\d+\.\s+(.*)/);
    if (olMatch) {
      const content = olMatch[2];
      if (!inList || listType !== 'ol') {
        if (inList) html.push(listType === 'ul' ? '</ul>' : '</ol>');
        html.push('<ol>');
        inList = true;
        listType = 'ol';
      }
      html.push(`<li>${content}</li>`);
      continue;
    }

    // 一般文字段落
    if (inList) {
      html.push(listType === 'ul' ? '</ul>' : '</ol>');
      inList = false;
      listType = null;
    }
    html.push(`<p>${trimmed}</p>`);
  }

  if (inList) {
    html.push(listType === 'ul' ? '</ul>' : '</ol>');
  }

  return html.join('\n');
}

function runLocalInference(chart, topic) {
  const mingP = chart.palaces[chart.posMing];
  const guanLuP = chart.palaces[(chart.posMing + 8) % 12];
  const caiBoP = chart.palaces[(chart.posMing + 4) % 12];
  const qianYiP = chart.palaces[(chart.posMing + 6) % 12];
  const shenP = chart.palaces[chart.posShen];
  const mingStars = mingP.majorStars.length > 0 ? mingP.majorStars.join("與") : "無主星 (借對宮星曜)";
  const sihuaSummary = Object.entries(chart.meta.sihua).map(([s, h]) => `${s}化${h}`).join("、");

  let topicTitle = "命局整體格局與性格特質總論";
  if (topic === "career") topicTitle = "官祿事業與職場競爭力";
  if (topic === "wealth") topicTitle = "財帛進財管道與資產佈局";
  if (topic === "marriage") topicTitle = "夫妻感情與伴侶宮位解讀";
  if (topic === "decadal") topicTitle = "大限運程走勢與四化轉折點";

  return `
### 一、${topicTitle}
本造為 **${chart.meta.gender}**，生逢 **${chart.meta.bureau}**，命宮坐立於 **${mingP.stem}${mingP.branch}宮**，由 **${mingStars}** 坐守。
- **本質稟賦**：主星於命宮展現核心思維。格局結構穩健，具備清晰的思考維度與實踐潛能。
- **身宮歸宿**：身宮坐落於 **${shenP.name}**，象徵人生三十歲後之發展重心與自我認同將強烈向該領域傾斜。

### 二、三方四正星曜結構審查
三方四正（命宮、財帛、官祿、遷移）構成了本命盤的核心框架：
- **官祿宮 (${guanLuP.stem}${guanLuP.branch})**：坐星 [${guanLuP.majorStars.join("、") || "空宮借星"}]，主導職場策略與事業企圖心。
- **財帛宮 (${caiBoP.stem}${caiBoP.branch})**：坐星 [${caiBoP.majorStars.join("、") || "空宮借星"}]，顯現以專業技術或穩健理財為主要求財路徑。
- **遷移外境 (${qianYiP.stem}${qianYiP.branch})**：會合星曜 [${qianYiP.majorStars.join("、") || "無"}]，為對外應對與人脈資源的投影。

### 三、生年四化動能與因果破立
全盤以生年四化（**${sihuaSummary}**）為動能中樞：
- **化祿所在**：天賦福氣與機會之湧現處，為個人最易切入的著力點。
- **化權所在**：意志貫徹與執掌主導之處，展現強大掌控欲與執行魄力。
- **化科所在**：名譽、貴人助力與逢凶化吉之智囊所在。
- **化忌所在**：執念與逆境修煉之關口，需透過持續深耕專業以破局。

> **大師戰略建議**：
> 紫微命盤重在「順勢而為、以智化煞」。認清自身優勢，善納化祿、化科之貴氣，自能在人生大運中建立長期優勢。
`.trim();
}

function streamTextToOutput(container, markdownText) {
  container.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "ai-markdown";
  container.appendChild(wrap);
  const cursor = document.createElement("span");
  cursor.className = "cursor-blink";
  container.appendChild(cursor);
  wrap.innerHTML = parseMarkdown(markdownText);
  cursor.remove();
}

// 呼叫 Google Gemini API (優先鎖定 3.8-flash、黑名單過濾與自動輪替容錯)
async function callGeminiAPI(apiKey, prompt) {
  // 步驟 1：向 Google 查詢該 API Key 當前擁有的所有模型
  const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
  let detectedModels = [];
  try {
    const listResp = await fetch(listUrl);
    if (listResp.ok) {
      const listData = await listResp.json();
      detectedModels = (listData.models || [])
        .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
        .map(m => m.name.replace(/^models\//, ""));
    }
  } catch (e) {
    console.warn("[Gemini API] 查詢清單略過，直接採用預設推薦順序", e);
  }

  // 步驟 2：黑名單過濾（排除 Google 官方明確提示新用戶無法使用的過渡模型）
  const blacklist = ["gemini-2.5-flash", "gemini-2.5-pro", "gemini-1.5-flash-002"];
  const availableFiltered = detectedModels.filter(m => 
    !blacklist.includes(m) && 
    !m.includes("embedding") && 
    !m.includes("aqa")
  );

  // 步驟 3：依 Google 官方建議設定優先候選順序（以 3.8-flash 為第一順位）
  const priorityList = [
    "gemini-3.8-flash",
    "gemini-3.8-flash-lite"
  ];

  // 將帳號探測到且未在黑名單的其他模型依序補在後方做為備援
  availableFiltered.forEach(m => {
    if (!priorityList.includes(m) && m.includes("flash")) priorityList.push(m);
  });
  availableFiltered.forEach(m => {
    if (!priorityList.includes(m)) priorityList.push(m);
  });

  console.log("[Gemini API] 本次嘗試模型優先順序：", priorityList);

  let lastErrorMsg = "";

  // 步驟 4：自動輪替調用，若遇到特定模型報錯則自動嘗試下一個
  for (const targetModel of priorityList) {
    try {
      console.log(`[Gemini API] 正在調用模型：${targetModel}`);
      const genUrl = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent?key=${apiKey}`;
      const response = await fetch(genUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            temperature: 0.65,
            maxOutputTokens: 8192 // 確保論命全文完整輸出
          }
        })
      });

      if (response.ok) {
        const data = await response.json();
        const candidate = data.candidates?.[0];
        if (candidate?.finishReason === "SAFETY") {
          throw new Error("解盤內容觸發安全審核機制，已被阻擋。");
        }
        console.log(`[Gemini API] 成功透過 ${targetModel} 完成排盤推演！`);
        return candidate.content.parts[0].text;
      } else {
        const errJson = await response.json().catch(() => ({}));
        lastErrorMsg = errJson.error?.message || `HTTP ${response.status}`;
        console.warn(`[Gemini API] 模型 ${targetModel} 回傳：${lastErrorMsg}，自動切換下一模型...`);

        // 若為 API Key 本身無效，則中斷輪替直接報錯
        if (lastErrorMsg.includes("API key not valid")) {
          throw new Error("API Key 無效，請檢查前後是否有空格。");
        }
      }
    } catch (err) {
      lastErrorMsg = err.message;
      if (lastErrorMsg.includes("API Key 無效")) throw err;
    }
  }

  throw new Error(`調用失敗：${lastErrorMsg}`);
}

async function callOpenAICompatibleAPI(endpoint, apiKey, prompt) {
  const url = `${endpoint.replace(/\/+$/, '')}/chat/completions`;
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
    body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "system", content: "你是一位精通紫微斗數的大師。" }, { role: "user", content: prompt }], temperature: 0.7 })
  });
  if (!response.ok) {
    const err = await response.json();
    throw new Error(err.error?.message || "API 請求失敗");
  }
  const data = await response.json();
  return data.choices[0].message.content;
}

async function triggerAIAnalysis() {
  if (!currentChartData) {
    alert("請先點擊「排列命盤」生成星盤資料！");
    return;
  }
  const modelChoice = document.getElementById("aiModelSelect").value;
  const focusTopic = document.getElementById("aiFocusTopic").value;
  const outBox = document.getElementById("aiOutputBox");
  const btn = document.getElementById("btnRunAI");
  const prompt = constructAIPrompt(currentChartData, focusTopic);

  btn.disabled = true;
  outBox.className = "ai-output-box loading";
  outBox.textContent = "星盤推演計算中，正在綜合格局、三方四正與生年四化動能...";

  try {
    let resultMarkdown = "";
    if (modelChoice === "builtin_local") {
      await new Promise(r => setTimeout(r, 400));
      resultMarkdown = runLocalInference(currentChartData, focusTopic);
    } else if (modelChoice === "gemini") {
      const apiKey = document.getElementById("userApiKey").value.trim();
      if (!apiKey) throw new Error("請先輸入有效的 Gemini API Key！");
      localStorage.setItem("saved_gemini_key", apiKey);
      resultMarkdown = await callGeminiAPI(apiKey, prompt);
    } else if (modelChoice === "openai_compatible") {
      const apiKey = document.getElementById("userApiKey").value.trim();
      const endpoint = document.getElementById("userApiEndpoint").value.trim();
      if (!apiKey) throw new Error("請先輸入 API Key！");
      resultMarkdown = await callOpenAICompatibleAPI(endpoint, apiKey, prompt);
    }
    outBox.className = "ai-output-box";
    streamTextToOutput(outBox, resultMarkdown);
  } catch (err) {
    outBox.className = "ai-output-box";
    outBox.innerHTML = `<span style="color:#b83b3b;">解析失敗：${err.message}</span>`;
  } finally {
    btn.disabled = false;
  }
}

function initDefaultDateTime() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  document.getElementById("solarDate").value = `${y}-${m}-${d}`;
  document.getElementById("hourBranch").value = "0";

  const lunarNow = solarToLunar(now);
  document.getElementById("lunarYear").value = lunarNow.year;
  document.getElementById("lunarMonth").value = lunarNow.month;
  document.getElementById("lunarDay").value = lunarNow.day;
}

window.onload = () => {
  initDefaultDateTime();
  const savedKey = localStorage.getItem("saved_gemini_key");
  if (savedKey) document.getElementById("userApiKey").value = savedKey;
  generateChart();
};
</script>
